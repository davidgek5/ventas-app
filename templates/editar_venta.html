{% extends "base.html" %}
{% block title %}Editar venta{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h1>Editar venta — {{ venta.local }}</h1>
  <form method="post">
    <div class="field">
      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" name="fecha" value="{{ venta.fecha }}" required>
    </div>
    <div class="field">
      <label for="monto">Total de ventas</label>
      <input type="text" id="monto" name="monto" value="{{ venta.monto }}" inputmode="decimal" required>
    </div>
    <button type="submit">Guardar cambios</button>
    <a href="{{ volver }}" style="margin-left:12px;">Cancelar</a>
  </form>
</div>
{% endblock %}
